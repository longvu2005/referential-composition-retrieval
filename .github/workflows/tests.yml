name: CPU contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  annotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install annotation dependencies only
        run: python -m pip install -r requirements/dataset.txt
      - name: Prepare actual source rows without model libraries
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          python tools/data/select_samples.py --output "$RUNNER_TEMP/selected.jsonl"
          python tools/data/prepare_review.py --selected "$RUNNER_TEMP/selected.jsonl" --output "$RUNNER_TEMP/review.jsonl" --reviewed "$RUNNER_TEMP/reviewed.jsonl"
          python tools/report.py --help
          python -m labelstudio.review.app --help
          python -m labelstudio.positives.app --help
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/dev.txt
      - name: Lint
        run: python -m ruff check src tools tests labelstudio
      - name: Check workflow syntax
        run: |
          bash -n scripts/setup.bash
          for workflow in scripts/data/*.bash scripts/methods/*.bash; do
            bash -n "$workflow"
          done
      - name: Test without downloaded model weights
        run: python -m pytest -q
