[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "referential-composition-retrieval"
version = "0.1.0"
description = "Research code and benchmark for Referential Composition Retrieval."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "google-genai>=2.17,<3",
    "numpy>=1.26,<2.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["rcr*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"


[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.ruff.lint.isort]
known-first-party = ["labelstudio", "rcr"]
