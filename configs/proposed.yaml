method: proposed
split: val
data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  detection_cache: cache/detections
  fafa_image_cache: cache/person-images
  fafa_query_cache: cache/person-queries
  scene_cache: cache/scene
detector:
  model: IDEA-Research/grounding-dino-tiny
  threshold: 0.3
  text_threshold: 0.25
image_encoder:
  model: openai/clip-vit-base-patch32
  revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  scene_size:
  - 224
  - 224
person_encoder:
  python: .venv-person-encoder/bin/python
  fafa_config: configs/person_encoder.yaml
  batch_size: 4
cache:
  storage_dtype: float16
  lru_mib: 1024
  native_lru_mib: 256
  supervision_cache: cache/train-supervision.json
  mmap_shards: false
  text_lru_mib: 256
model:
  text_model: openai/clip-vit-base-patch32
  dim: 384
  dropout: 0.1
  identity_dim: 128
  fda_k: 6
  state_dim: 512
  coarse_beta: 0.4
  num_heads: 6
  mlp_ratio: 2
  geo_dim: 32
  fine_matching:
    background_logit: -3.5
    selection_threshold: 0.5
    identity_threshold: 0.2
    missing_penalty: 1.1
    duplicate_iou: 0.9
train:
  epochs: 20
  context_warmup_epochs: 4
  batch_size: 24
  candidates: 32
  context_batch_size: 64
  case_balanced: true
  seed: 0
  amp: true
  mining_batch_size: 8
  identity_sampling:
    max_crops: 128
    crops_per_identity: 2
    random_identities: 8
    hard_negative_fraction: 0.2
  sampling:
    positives_per_query: 2
    identity_fraction: 0.5
    hard_fraction: 0.1
    semantic_hard_fraction: 0.3
    warmup_epochs: 8
    refresh_every_epochs: 2
    pool_size: 100
optimizer:
  lr: 0.0001
  text_lr: 1.0e-05
  min_lr_ratio: 0.1
  weight_decay: 0.01
loss:
  grounding_weight: 1.0
  grounding_owner_weight: 0.25
  identity_weight: 0.1
  identity_temperature: 0.1
  coarse_weight: 1.0
  coarse_temperature: 0.1
  context_weight: 1.0
  context_temperature: 0.1
  context_rejection_weight: 0.5
  context_swap_weight: 0.25
  state_weight: 1.0
  state_temperature: 0.1
retrieval:
  pooling: subject_mean
  fine_score_mode: linear
  coverage_weight: 0.04
  context_weight: 0.1
  fine_coarse_weight: 0.15
  coarse_beta: 1.16
  top_m: 500
  fine_batch_size: 64
  identity_batch_size: 512
  coarse_batch_size: 512
candidate_ks:
- 500
evaluation:
  enabled: true
  every_epochs: 2
  calibration:
    coverage_weights:
    - 0.0
    - 0.02
    - 0.04
    - 0.06
    - 0.08
    - 0.09
    - 0.12
    - 0.16
    context_weights:
    - 0.0
    - 0.005
    - 0.01
    - 0.0125
    - 0.015
    - 0.0175
    - 0.02
    - 0.03
    - 0.04
    - 0.06
    - 0.1
    - 0.2
    fine_coarse_weights:
    - 0.1
    - 0.125
    - 0.1375
    - 0.15
    - 0.175
    - 0.2
wandb:
  enabled: true
  project: referential-composition-retrieval
  name: proposed
  mode: online
  log_every_steps: 20
runtime:
  device: cuda
  deterministic: true
checkpoint: runs/proposed/best.pt
output:
  dir: runs/proposed
