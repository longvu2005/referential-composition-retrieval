# Frozen FAFA identity + CLIP semantics + DINO context; v2 checkpoints only.
method: proposed
split: val
data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  cache: cache/proposed-fafa
  dino_cache: cache/proposed-dino
  clip_cache: cache/proposed-clip-v4
detector:
  model: IDEA-Research/grounding-dino-tiny
  threshold: 0.3
  text_threshold: 0.25
image_encoder:
  model: facebook/dinov3-vitb16-pretrain-lvd1689m
  scene_size: [224, 224]
  person_size: [256, 128]
person_encoder:
  backend: fafa
  fafa_config: configs/fafa.yaml
  batch_size: 4
clip_encoder:
  model: openai/clip-vit-base-patch32
  # Pinned Hugging Face revision shared by image encoder, text encoder and processor.
  revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  batch_size: 16
cache:
  # Reuse the existing published DINO cache with known original settings.
  # Set false for caches whose encoder/detector/preprocessing are unknown.
  allow_legacy_dino: true
  storage_dtype: float16
  lru_mib: 512
  prefetch_batches: 1
  # After validated FAFA features exist, release only its downloadable base assets.
  # Set false to retain them for another native FAFA use in this same runtime.
  release_fafa_assets: true
model:
  dim: 256
  identity_dim: 128
  num_heads: 4
  max_subjects: 16
  dropout: 0.1
  transport_tau: 0.2
  transport_iterations: 512
  transport_tolerance: 0.00001
  roi_size: 2
  roi_expansion: 1.25
train:
  epochs: 20                 # Includes warmup; main training starts at epoch 3.
  warmup_epochs: 2
  batch_size: 2
  candidates: 8
  pair_batch_size: 8
  seed: 0
  amp: true
  max_grad_norm: 5.0
  sampling:
    positives_per_query: 2
    identity_fraction: 0.5
    hard_fraction: 0.3
    refresh_every_epochs: 2
    pool_size: 100
optimizer:
  lr: 0.0001
  weight_decay: 0.01
loss:
  identity_weight: 0.1
  matching_weight: 1.0
  retrieval_weight: 1.0
  identity_temperature: 0.1
  rank_temperature: 0.1
retrieval:
  mode: shortlist             # shortlist | full | coarse
  top_m: 500                  # Starting point, not a measured optimum.
  fine_batch_size: 16
  identity_batch_size: 512
  coarse_batch_size: 256
candidate_ks: [100, 500]
evaluation:
  enabled: true
  every_epochs: 2
wandb:
  enabled: false
  project: referential-composition-retrieval
  name: soft-partial-v2
  mode: online
runtime:
  device: auto
checkpoint: runs/proposed-v2/best.pt
output:
  dir: runs/proposed-v2
