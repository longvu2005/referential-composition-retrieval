# Proposed: Frozen CLIP B/32 + FAFA + learned relational context.
method: proposed
split: val

# Dataset and feature caches.
data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  detection_cache: cache/detections
  fafa_image_cache: cache/person-images
  fafa_query_cache: cache/person-queries
  scene_cache: cache/scene

# Person detection.
detector:
  model: IDEA-Research/grounding-dino-tiny
  threshold: 0.3
  text_threshold: 0.25

# Frozen CLIP image encoder.
image_encoder:
  model: openai/clip-vit-base-patch32
  revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  scene_size: [224, 224]        # Letterboxed input; rebuild cache if changed.

# Frozen FAFA person encoder.
person_encoder:
  python: .venv-fafa/bin/python
  fafa_config: configs/fafa.yaml
  batch_size: 4

# Cache storage and memory limits.
cache:
  storage_dtype: float16
  lru_mib: 1024                 # Scene cache.
  native_lru_mib: 256          # FAFA cache.
  supervision_cache: cache/train-supervision.json
  mmap_shards: false
  text_lru_mib: 256            # Frozen CLIP text features.

# Trainable model architecture.
model:
  text_model: openai/clip-vit-base-patch32
  dim: 384                     # Shared feature dimension.
  dropout: 0.1
  identity_dim: 128
  fda_k: 6                     # Top-K FAFA token similarities.
  state_dim: 512
  coarse_beta: 0.4             # Default state fusion weight.
  num_heads: 6
  mlp_ratio: 2
  geo_dim: 32

  # Subject selection and partial identity matching.
  fine_matching:
    selection_threshold: 0.5
    identity_threshold: 0.2
    missing_penalty: 1.1       # Penalty for unmatched persons.
    duplicate_iou: 0.9        # Suppress duplicate detections.

# Training schedule and sampling.
train:
  epochs: 20
  context_warmup_epochs: 3    # Context starts at epoch 4; 0 = joint from epoch 1.
  batch_size: 14               # Queries per batch.
  candidates: 32              # Gallery candidates per query.
  case_balanced: true         # P(case) proportional to sqrt(N_case).
  seed: 0
  amp: true
  mining_batch_size: 8

  # Additional crops for identity supervision.
  identity_sampling:
    max_crops: 128
    crops_per_identity: 2
    random_identities: 8

  # Positive and negative sampling.
  sampling:
    positives_per_query: 2
    identity_fraction: 0.5
    hard_fraction: 0.3
    warmup_epochs: 3          # Delay hard-negative mining only.
    refresh_every_epochs: 2
    pool_size: 100

# AdamW optimization; pretrained encoders remain frozen.
optimizer:
  lr: 0.0001
  text_lr: 1.0e-05
  weight_decay: 0.01

# Grounding + crop identity + coarse identity + conditional context + global state.
loss:
  grounding_weight: 1.0
  identity_weight: 0.1
  coarse_weight: 1.0
  context_weight: 1.0           # Loss weight; inference gamma is under retrieval.
  identity_temperature: 0.1
  coarse_temperature: 0.1
  state_weight: 1.0
  state_temperature: 0.1

# Coarse retrieval and Top-M fine reranking.
retrieval:
  # Fine = alpha * FAFA + gamma * z(coverage * context).
  # Final = z(fine) + lambda * z(coarse).
  fine_score_mode: context_zscore
  context_weight: 0.0325       # gamma
  coarse_beta: 0.4             # Coarse state weight.
  fine_coarse_weight: 0.025    # lambda
  top_m: 500
  fine_batch_size: 64
  identity_batch_size: 512
  coarse_batch_size: 512

# Validation and coarse shortlist metrics.
candidate_ks: [100, 500]
evaluation:
  enabled: true
  every_epochs: 2

# Experiment logging.
wandb:
  enabled: true
  project: referential-composition-retrieval
  name: proposed
  mode: online
  log_every_steps: 20

# Runtime and checkpoints.
runtime:
  device: cuda

checkpoint: runs/proposed/best.pt
output:
  dir: runs/proposed
