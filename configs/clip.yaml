method: clip
mode: late_fusion  # clip_image | clip_text | early_fusion | late_fusion
split: val

data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images

model:
  name: ViT-L/14
  # One official CLIP checkpoint includes both image and text encoder weights.
  checkpoint: checkpoints/clip/ViT-L-14.pt

text_field: final_instruction
fusion:
  # Fixed weights for the low-level retrieve CLI. run selects on val.
  image_weight: 0.5
  text_weight: 0.5
  score_normalization: zscore  # late fusion: complete eligible split gallery
  epsilon: 1.0e-6

tuning:
  metric: full_map
  # image_weight = alpha, text_weight = 1 - alpha; tune each fusion separately.
  image_weights: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
                  0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

runtime:
  device: auto
  image_batch_size: 32
  text_batch_size: 128
  score_batch_size: 128
  num_workers: 0

cache:
  dir: cache/clip
output:
  dir: runs/clip
