# Epoch checkpoints use balanced val mAP; the suite selects variants by Full-mAP.
base_config: configs/methods/proposed.yaml
stage: train
output_dir: runs/ablations/identity_balance
# Existing reference is only used to freeze coarse rankings/scores, not weights.
fixed_coarse:
  checkpoint: runs/proposed/best.pt
select:
  metric: full_map
confirmation:
  control: A_control
  seeds: [1, 2]
overrides:
  train.seed: 0
  model.identity_balance.mode: none
  model.identity_balance.scale: 1.0
  model.identity_balance.alpha: 1.0
  evaluation.branch_norms: true
  retrieval.coarse_mode: identity_state
  retrieval.coarse_beta: 0.4
  retrieval.coarse_normalization: zscore
  retrieval.fine_coarse_weight: 0.4
  retrieval.rerank: true
  retrieval.top_m: 500
  candidate_ks: [100, 500]
experiments:
  - name: A_control
  - name: B_scale
    overrides:
      model.identity_balance.mode: pre_scale
    sweep:
      model.identity_balance.scale: [4, 8, 16]
  - name: C_layernorm
    overrides:
      model.identity_balance.mode: layernorm
  - name: D_l2
    overrides:
      model.identity_balance.mode: l2
    sweep:
      model.identity_balance.alpha: [0.5, 1.0, 2.0]
