# Optional: retrain score-removal variants on the same FAFA cache.
# Semantic context and coarse identity remain present in every variant.
base_config: configs/proposed.yaml
stage: train
output_dir: runs/ablations/binding_train
experiments:
  - name: full
  - name: identity_binding
    overrides:
      model.binding_mode: identity
  - name: semantic_binding
    overrides:
      model.binding_mode: semantic
  - name: context_only
    overrides:
      model.binding_mode: none
