# Remove score terms from ONE fully trained, calibrated checkpoint.
# Coarse shortlist, gamma, normalization and final fusion weights stay fixed.
base_config: runs/calibration/selected.yaml
stage: inference
output_dir: runs/ablations/binding
experiments:
  - name: full
    overrides:
      retrieval.binding_mode: both
  - name: without_identity_binding
    overrides:
      retrieval.binding_mode: semantic
  - name: without_semantic_binding
    overrides:
      retrieval.binding_mode: identity
  - name: context_only
    overrides:
      retrieval.binding_mode: none
