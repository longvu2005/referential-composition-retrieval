# Optional diagnostics AFTER fine_coarse.yaml selects the joint pair on val.
# Compare coarse modes at the same checkpoint and selected beta; no selection.
base_config: runs/ablations/fine_coarse/selected.yaml
stage: inference
output_dir: runs/ablations/coarse
overrides:
  retrieval.rerank: false
  retrieval.coarse_normalization: zscore
experiments:
  - name: identity_only
    overrides:
      retrieval.coarse_mode: identity_only
  - name: state_only
    overrides:
      retrieval.coarse_mode: state_only
  - name: fusion_raw
    overrides:
      retrieval.coarse_mode: identity_state
      retrieval.coarse_normalization: none
  - name: fusion_zscore
    overrides:
      retrieval.coarse_mode: identity_state
