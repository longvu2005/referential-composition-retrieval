# Validation calibration, not an architecture ablation. Only the winner reaches test.
base_config: configs/proposed.yaml
stage: inference
output_dir: runs/calibration
experiments:
  - name: joint
    sweep:
      retrieval.coarse_beta: [0.0, 0.1, 0.25, 0.4, 0.5, 1.0, 2.0, 4.0]
      retrieval.fine_coarse_weight: [0.0, 0.1, 0.25, 0.4, 0.5, 1.0, 2.0]
select:
  group: joint
  metric: full_map
