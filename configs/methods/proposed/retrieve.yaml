data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  cache: cache/proposed

checkpoint: runs/proposed/best.pt
split: test

retrieval:
  # state_dim and coarse_beta are read from the training checkpoint.
  top_m: 500
  fine_batch_size: 64
  # Identity/state embeddings stay in RAM; these bound GPU working memory.
  identity_batch_size: 512
  coarse_batch_size: 512
  device: auto

output:
  dir: runs/proposed/test
