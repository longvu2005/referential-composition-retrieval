data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  cache: cache/proposed

model:
  text_model: google-bert/bert-base-uncased
  identity_dim: 256
  num_heads: 8
  mlp_ratio: 4
  geo_dim: 32

train:
  epochs: 10
  batch_size: 14
  candidates: 16
  # full_gallery preserves the supplied benchmark protocol; choose
  # train_gallery when held-out images must not supply training negatives.
  negative_pool: full_gallery
  seed: 0
  device: auto

optimizer:
  lr: 1.0e-4
  text_lr: 1.0e-5
  weight_decay: 1.0e-2

loss:
  grounding_weight: 1.0
  identity_weight: 0.1
  retrieval_weight: 1.0
  identity_temperature: 0.1

evaluation:
  enabled: true
  # Evaluate at this interval and always at the final epoch.
  every_epochs: 2
  # Fixed random train subset for an overfitting diagnostic; 0 disables it.
  train_max_queries: 100
  # The complete validation split is always evaluated.
  top_m: 500
  fine_batch_size: 64
  # Identities stay in RAM; these limit GPU projection and coarse scoring.
  identity_batch_size: 512
  coarse_batch_size: 512
  candidate_ks: [100, 500]

wandb:
  enabled: true
  project: referential-composition-retrieval
  name: null
  mode: online
  log_every_steps: 20

output:
  dir: runs/proposed
