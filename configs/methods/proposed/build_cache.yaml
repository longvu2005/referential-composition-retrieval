data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  cache: cache/proposed

detector:
  model: IDEA-Research/grounding-dino-tiny
  threshold: 0.30
  text_threshold: 0.25

image_encoder:
  model: facebook/dinov3-vitb16-pretrain-lvd1689m
  # [height, width], aspect ratio preserved by letterbox padding.
  scene_size: [224, 224]
  person_size: [256, 128]

cache:
  # float16 halves feature storage; decoded features are cast to float32.
  # Keep float32 to preserve the existing numerical baseline.
  storage_dtype: float16

device: auto
