data:
  final_dir: dataset/data/final
  image_root: dataset/data/raw/images
  cache: cache/proposed

model:
  text_model: google-bert/bert-base-uncased
  identity_dim: 256
  state_dim: 256
  # Starting value; tune on validation. Saved in the checkpoint config.
  coarse_beta: 0.3
  num_heads: 8
  mlp_ratio: 4
  geo_dim: 32

train:
  epochs: 1
  batch_size: 2
  candidates: 4
  seed: 0
  device: auto

optimizer:
  lr: 1.0e-4
  text_lr: 1.0e-5
  weight_decay: 1.0e-2

loss:
  grounding_weight: 1.0
  identity_weight: 0.1
  retrieval_weight: 1.0
  identity_temperature: 0.1
  state_weight: 1.0
  state_temperature: 0.1

evaluation:
  enabled: false

wandb:
  enabled: false

output:
  dir: runs/smoke
